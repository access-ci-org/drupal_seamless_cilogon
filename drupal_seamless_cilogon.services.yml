services:
  http_middleware.CookieMiddleware:
    class: '\Drupal\drupal_seamless_cilogon\StackMiddleware\CookieMiddleware'
    arguments:
      - '@logger.factory'
      - '@state'
      - '@module_handler'
      - '@entity_type.manager'
    tags:
      - { name: http_middleware, priority: 250, responder: true }

  drupal_seamless_cilogon_event_subscriber:
    class: '\Drupal\drupal_seamless_cilogon\EventSubscriber\DrupalSeamlessCilogonEventSubscriber'
    arguments:
      - '@state'
      - '@config.factory'
      - '@current_user'
      - '@current_route_match'
      - '@logger.factory'
      - '@request_stack'
      - '@messenger'
      - '@token'
      - '@module_handler'
      - '@session_manager'
      - '@plugin.manager.openid_connect_client'
      - '@plugin.manager.cilogon_auth_client.processor'
      - '@cilogon_auth.claims'
    tags:
      - { name: 'event_subscriber' }
