services:
  drupal_seamless_cilogon.page_cache_request_policy.deny_seamless_cookie:
    class: Drupal\drupal_seamless_cilogon\PageCache\DenySeamlessCookie
    tags:
      - { name: page_cache_request_policy }

  drupal_seamless_cilogon_event_subscriber:
    class: '\Drupal\drupal_seamless_cilogon\EventSubscriber\DrupalSeamlessCilogonEventSubscriber'
    arguments:
      - '@state'
      - '@config.factory'
      - '@current_user'
      - '@current_route_match'
      - '@logger.factory'
      - '@request_stack'
      - '@messenger'
      - '@token'
      - '@module_handler'
      - '@session_manager'
      - '@plugin.manager.openid_connect_client'
      - '@openid_connect.claims'
      - '@page_cache_kill_switch'
    tags:
      - { name: 'event_subscriber' }
